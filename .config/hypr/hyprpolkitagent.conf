# Tokyo Night Theme for Hyprpolkitagent
# Values are in ARGB or Hex format

general {
    # Main window background (Stormy Dark)
    background_color = rgba(1a1b26ff)
    
    # Border color (Tokyo Blue)
    border_color = rgba(7aa2f7ff)
    border_size = 2
    rounding = 10

    # Text colors
    text_color = rgba(cfc9c2ff)
    label_color = rgba(9ece6aff) # Tokyo Green for titles
}

input {
    # Password field styling
    background_color = rgba(24283bff) # Slightly lighter background
    border_color = rgba(bb9af7ff) # Purple border for focus
    text_color = rgba(cfc9c2ff)
}

buttons {
    # Confirm button (Purple)
    confirm_background = rgba(bb9af7ff)
    confirm_text = rgba(1a1b26ff) # Dark text on light button
    
    # Cancel button
    cancel_background = rgba(414868ff)
    cancel_text = rgba(cfc9c2ff)
}
